# yaml-language-server: $schema=../../schema/catalog-entry.schema.json
id: i18n-rules
name: Internationalization rules
category: i18n
select: checkbox
summary: Route every user-facing string through the i18n library, with consistent keys
topic: i18n
snippet:
  rule: |
    Never hardcode user-facing text; route every string through the i18n library with a key named `area.screen.element`, such as `recipes.list.emptyState`.
    Add each new key to every locale file in the same change, marking untranslated values so they are easy to find.
    Format dates, numbers and currency with the locale APIs, never by hand.
  why: Retrofitting translations means touching every screen, while routing strings from day one makes a new language a configuration change.
