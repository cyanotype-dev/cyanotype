# yaml-language-server: $schema=../../schema/catalog-entry.schema.json
id: pnpm
name: pnpm
category: package-manager
select: radio
url: https://pnpm.io
summary: Fast, disk-efficient package manager for Node.js
requires: [node]
level: beginner
topic: tooling
snippet:
  rule: Use pnpm for every install and script. Never run npm or yarn.
  why: Mixing package managers creates conflicting lockfiles.
enforce:
  claude:
    # The snippet forbids npm and yarn entirely, so the rules cover the whole
    # command, bare or with any subcommand (npm i, ci, add, run...); npx is
    # not matched. Checked with Claude Code 2.1.299 (docs/enforce-checks.md).
    # Bash and PowerShell both, since a rule on one shell does not cover the
    # other. Not blocked: npm.cmd in Bash, and scripts.
    deny:
      - "Bash(npm *)"
      - "Bash(yarn *)"
      - "PowerShell(npm *)"
      - "PowerShell(yarn *)"
    # With dependency-approval selected, the agent asks before adding a
    # package. Ask, not deny, so an approved dependency can still be added.
    with:
      dependency-approval:
        ask: ["Bash(pnpm add *)", "PowerShell(pnpm add *)"]
detect:
  files: [pnpm-lock.yaml]
