# yaml-language-server: $schema=../../schema/catalog-entry.schema.json
id: npm
name: npm
category: package-manager
select: radio
url: https://docs.npmjs.com
summary: The package manager bundled with Node.js
requires: [node]
level: beginner
topic: tooling
snippet:
  rule: Use npm for every install and script, and commit package-lock.json. Never run pnpm or yarn.
  why: Mixing package managers creates conflicting lockfiles.
enforce:
  claude:
    # The whole commands, bare or with any subcommand, in Bash and
    # PowerShell. Checked with Claude Code 2.1.299 (docs/enforce-checks.md).
    deny:
      - "Bash(pnpm *)"
      - "Bash(yarn *)"
      - "PowerShell(pnpm *)"
      - "PowerShell(yarn *)"
    # With dependency-approval selected, the agent asks before adding a
    # package. A pattern ending in " *" also matches the bare command, so a
    # plain npm install, which only restores the lockfile, asks too.
    with:
      dependency-approval:
        ask:
          - "Bash(npm install *)"
          - "Bash(npm i *)"
          - "Bash(npm add *)"
          - "PowerShell(npm install *)"
          - "PowerShell(npm i *)"
          - "PowerShell(npm add *)"
detect:
  files: [package-lock.json]
  run_script: npm run {script}
