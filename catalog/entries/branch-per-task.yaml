id: branch-per-task
name: One branch per task
category: git
select: checkbox
summary: Every task gets its own branch, merged through a pull request
level: beginner
topic: git
snippet:
  rule: Start each task on a new branch from an up-to-date default branch, and merge it through a pull request. Never commit directly to the default branch.
  why: Each change gets reviewed on its own and can be reverted without touching unrelated work.
