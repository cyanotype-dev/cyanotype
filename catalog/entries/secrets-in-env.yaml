# yaml-language-server: $schema=../../schema/catalog-entry.schema.json
id: secrets-in-env
name: Secrets only in .env
category: agent-safety
select: checkbox
summary: Secrets live in an ignored .env file, never in code or commits
topic: safety
snippet:
  rule: |
    Keep secrets in `.env`, which stays in `.gitignore`; never hardcode or commit them, and do not read `.env` files.
    When you add a variable, add its name with a placeholder value to `.env.example`.
  why: A committed secret stays in git history and has to be rotated.
enforce:
  claude:
    # The negations keep .env.example readable and writable. Read rules block
    # reads and the Edit and Write tools; Edit rules also block shell writes
    # such as >> .env, tee -a and PowerShell Add-Content.
    #
    # Checked with Claude Code 2.1.299 (docs/enforce-checks.md). Not blocked:
    # reads that do not name the file (globs such as cat .en*, command
    # substitution, source, grep -r) and scripts that open the file
    # themselves.
    deny:
      - "Read(.env)"
      - "Read(.env.*)"
      - "Read(!.env.example)"
      - "Edit(.env)"
      - "Edit(.env.*)"
      - "Edit(!.env.example)"
  # Keeps .env files out of every commit, humans' included; the negation
  # keeps .env.example committed.
  gitignore: [".env", ".env.*", "!.env.example"]
detect:
  files: [.env.example]
