# yaml-language-server: $schema=../../schema/catalog-entry.schema.json
id: secrets-in-env
name: Secrets only in .env
category: agent-safety
select: checkbox
summary: Secrets live in an ignored .env file, never in code or commits
topic: safety
snippet:
  rule: |
    Keep secrets in `.env`, which stays in `.gitignore`; never hardcode or commit them, and do not read `.env` files.
    When you add a variable, add its name with a placeholder value to `.env.example`.
  why: A committed secret stays in git history and has to be rotated.
enforce:
  claude:
    # The negation keeps .env.example readable; the deny rules also block
    # edits to the same paths.
    deny: ["Read(.env)", "Read(.env.*)", "Read(!.env.example)"]
detect:
  files: [.env.example]
