name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        # The race detector needs cgo; run it on Linux only to keep the other runners simple.
        run: go test ${{ runner.os == 'Linux' && '-race' || '' }} ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with the version in CONTRIBUTING.md.
          version: v2.15.0

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The standard library is checked at the Go version in go.mod, the one
      # releases are built with.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        # Keep in sync with the version in CONTRIBUTING.md.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      # govulncheck exits non-zero only for a vulnerability that code in this
      # module calls; one in a required module that nothing calls is listed
      # but passes. Each release OS is checked, since some code is built for
      # one OS only (golang.org/x/sys/windows).
      - name: Check for vulnerabilities
        run: |
          for goos in linux darwin windows; do
            echo "== GOOS=$goos"
            GOOS=$goos govulncheck ./...
          done
